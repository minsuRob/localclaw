name: Deploy Chat Web to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/chat-web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/chat-web/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: apps/chat-web

      - name: Build
        run: npm run build
        working-directory: apps/chat-web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/chat-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

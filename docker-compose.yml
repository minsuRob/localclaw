# =============================================================
# Mac 전략 A: OpenClaw Docker + 네이티브 llama.cpp
# llama.cpp는 Mac 호스트에서 직접 실행 (Metal GPU 가속)
# OpenClaw는 Docker 컨테이너로 실행
# =============================================================

services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      # GH Pages: stock image has no OPTIONS/CORS on /v1/chat/completions (Failed to fetch)
      - ./scripts/patches/openclaw-http-endpoint-helpers-cors.js:/app/dist/http-endpoint-helpers-QzVdktwB.js:ro
      - openclaw_home:/home/node
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      # openclaw.json gateway.auth.password → ${OPENCLAW_GATEWAY_PASSWORD}
      - OPENCLAW_GATEWAY_PASSWORD=${OPENCLAW_GATEWAY_PASSWORD:-${OPENCLAW_GATEWAY_TOKEN}}
      - OPENCLAW_DISABLE_BONJOUR=${OPENCLAW_DISABLE_BONJOUR:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - openclaw-network

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: openclaw-cli
    profiles:
      - cli
    network_mode: "service:openclaw-gateway"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - openclaw_home:/home/node
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    entrypoint: ["openclaw"]
    stdin_open: true
    tty: true

volumes:
  openclaw_home:
    name: ${OPENCLAW_HOME_VOLUME:-openclaw_home}

networks:
  openclaw-network:
    driver: bridge
    name: openclaw-network
